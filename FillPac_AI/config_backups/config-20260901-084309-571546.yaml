project:
  name: FillPac AI
  version: BGCNT_01_01_01
model:
  path: models/fillpac_yolo26n_best.pt
  confidence: 0.2
  iou: 0.45
  device: cpu
  image_size: 640
  half: false
  max_detections: 20
  min_bbox_area: 800
  detection_roi:
    x1: 0
    y1: 120
    x2: 1920
    y2: 1080
  allowed_classes:
  - 0
  - 1
  bag_confidence: 0.35
  print_confidence: 0.2
tracker:
  type: bytetrack
  track_high_thresh: 0.45
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  track_buffer: 60
  match_thresh: 0.85
  frame_rate: 25
  minimum_consecutive_frames: 1
  min_track_age: 4
  min_bbox_area: 4000
  min_bbox_area_ratio: 0.002
  min_track_confidence: 0.25
  max_jump_distance: 250
  min_iou_warning: 0.1
  unstable_frame_threshold: 3
  history_ttl_frames: 120
counting:
  method: center
  direction: left
  duplicate_distance: 30
  duplicate_time: 0.8
  line_tolerance: 12
  late_start_margin: 40
  minimum_cross_distance: 15
  min_track_frames: 4
  stale_track_frames: 120
print_detection:
  enabled: true
  confidence: 0.2
  iou: 0.45
  iou_threshold: 0
  min_overlap_ratio: 0.3
  min_print_area: 80
  max_print_area: 0
  min_aspect_ratio: 0
  max_aspect_ratio: 0
  max_center_distance: 0
  vote_threshold: 0.6
  min_votes: 4
  min_observations: 4
  history_size: 30
  history_ttl_frames: 120
  min_observation_speed: 0
  skip_motion_jump_observations: true
jam_detection:
  enabled: true
  roi:
    x1: 180
    y1: 90
    x2: 1220
    y2: 680
  history_seconds: 1
  min_history_seconds: 0.5
  stationary_speed_threshold: 4
  slow_speed_threshold: 9
  warning_time_seconds: 3
  jam_time_seconds: 5
  recovery_time_seconds: 1
  min_track_age: 4
  ignore_unstable_tracks: true
  ignore_motion_jumps: true
  track_ttl_seconds: 2
bag_spacing:
  enabled: true
  direction: left
  minimum_safe_gap_mm: 650
  measurement_margin_mm: 5
  jam_threshold_mm: 655
  min_track_age: 4
  ignore_unstable_tracks: true
  ignore_motion_jumps: true
  jam_confirm_frames: 3
  recovery_confirm_frames: 3
  roi:
    x1: 180
    y1: 90
    x2: 1220
    y2: 680
  calibration:
    image_points:
    - - 180
      - 90
    - - 1220
      - 90
    - - 1220
      - 680
    - - 180
      - 680
    world_points_mm:
    - - 0
      - 0
    - - 2540
      - 0
    - - 2540
      - 1550
    - - 0
      - 1550
condition_c:
  enabled: true
  roi:
    x1: 180
    y1: 90
    x2: 1220
    y2: 680
  max_allowed_bags: 2
  min_track_age: 4
  ignore_unstable_tracks: true
  ignore_motion_jumps: true
  jam_confirm_frames: 3
  recovery_confirm_frames: 3
  save_roi_image: true
  save_full_frame: false
  save_distances: true
  capture_cooldown_seconds: 1
  image_directory: logs/roi_images
