project:
  name: FillPac AI
  version: 1.1.0


# ==========================================================
# MODEL
# ==========================================================

model:
  path: models/fillpac_yolo26n_best.pt

  # Global YOLO confidence must be <= lowest class threshold.
  confidence: 0.20
  iou: 0.45

  device: cpu

  # Better resolution for relatively small print objects.
  image_size: 640

  half: false
  max_detections: 20
  min_bbox_area: 800

  detection_roi:
    x1: 0
    y1: 120
    x2: 1920
    y2: 1080

  allowed_classes:
    - 0
    - 1

  # Class-specific thresholds
  bag_confidence: 0.35
  print_confidence: 0.20


# ==========================================================
# TRACKER
# ==========================================================

tracker:
  type: bytetrack

  track_high_thresh: 0.45
  track_low_thresh: 0.10
  new_track_thresh: 0.60

  track_buffer: 60
  match_thresh: 0.85

  frame_rate: 30
  minimum_consecutive_frames: 1

  min_track_age: 4

  min_bbox_area: 4000
  min_bbox_area_ratio: 0.002
  min_track_confidence: 0.25

  max_jump_distance: 250
  min_iou_warning: 0.10

  unstable_frame_threshold: 3
  history_ttl_frames: 120


# ==========================================================
# COUNTING
# ==========================================================

counting:
  method: center

  # Preserve current movement direction
  direction: up

  duplicate_distance: 30
  duplicate_time: 0.8

  line_tolerance: 12
  late_start_margin: 40

  minimum_cross_distance: 15
  min_track_frames: 4

  stale_track_frames: 120


# ==========================================================
# PRINT DETECTION
# ==========================================================

print_detection:
  enabled: true

  confidence: 0.20
  iou: 0.45

  iou_threshold: 0.0
  min_overlap_ratio: 0.30

  min_print_area: 80
  max_print_area: 0

  min_aspect_ratio: 0
  max_aspect_ratio: 0
  max_center_distance: 0

  # Temporal voting
  vote_threshold: 0.60
  min_votes: 4
  min_observations: 4

  history_size: 30
  history_ttl_frames: 120

  min_observation_speed: 0.0
  skip_motion_jump_observations: true


# ==========================================================
# JAM DETECTION
# ==========================================================
#
# Current normal-video observations:
#
# Far bags:
#   approximately 12-15 px/s
#
# Mid / near bags:
#   approximately 35-100+ px/s
#
# Therefore:
#
# <= 4 px/s     = potentially stationary
# 4-9 px/s      = slow
# > 9 px/s      = normal
#
# A JAM is NOT triggered only by low speed.
# Low movement must persist for the configured time.
#
# ==========================================================

jam_detection:
  enabled: true

  # Current same-angle test-video monitoring area
  roi:
    x1: 0
    y1: 150
    x2: 477
    y2: 500

  # Trajectory history
  history_seconds: 1.0
  min_history_seconds: 0.5

  # Motion thresholds
  stationary_speed_threshold: 4.0
  slow_speed_threshold: 9.0

  # Temporal decision
  warning_time_seconds: 3.0
  jam_time_seconds: 5.0

  recovery_time_seconds: 1.0

  # Track validation
  min_track_age: 4

  ignore_unstable_tracks: true
  ignore_motion_jumps: true

  track_ttl_seconds: 2.0

# ==========================================================
# BAG SPACING JAM DETECTION - CONDITION B
# ==========================================================
#
# Purpose:
# Detect a bag jam when the physical edge-to-edge distance
# between any two adjacent bags is less than or equal to
# the configured threshold.
#
# Decision:
#
#   gap_mm <= jam_threshold_mm  -> JAM
#   gap_mm >  jam_threshold_mm  -> NORMAL
#
# IMPORTANT:
# - No timer is used.
# - No stationary condition is required.
# - Only adjacent bags are compared.
# - Distance is calculated after pixel -> mm calibration.
#
# NOTE:
# Calibration values below are DEVELOPMENT REFERENCE VALUES.
# They MUST be replaced with actual measured conveyor
# coordinates for production.
# ==========================================================

bag_spacing:
  enabled: true

  # Conveyor movement direction
  direction: up

  # --------------------------------------------------------
  # JAM DISTANCE
  # --------------------------------------------------------
  #
  # Actual required minimum normal spacing = 300 mm
  # Measurement / calibration margin        =   5 mm
  #
  # Effective jam threshold                 = 305 mm
  #
  # Therefore:
  #
  # > 305 mm  = NORMAL
  # <=305 mm  = JAM
  # --------------------------------------------------------

  minimum_safe_gap_mm: 150.0
  measurement_margin_mm: 5.0
  jam_threshold_mm: 155.0

  # --------------------------------------------------------
  # TRACK VALIDATION
  # --------------------------------------------------------

  min_track_age: 4

  ignore_unstable_tracks: true
  ignore_motion_jumps: true

  # --------------------------------------------------------
  # BAG SPACING ROI
  # --------------------------------------------------------
  #
  # Only bags whose centers are inside this region are
  # considered for spacing calculation.
  #
  # Current development ROI matches the jam monitoring area.
  # --------------------------------------------------------

  roi:
    x1: 0
    y1: 150
    x2: 477
    y2: 500

  # --------------------------------------------------------
  # CAMERA CALIBRATION
  # --------------------------------------------------------
  #
  # Homography maps:
  #
  #       IMAGE PIXELS
  #            |
  #            v
  #       REAL WORLD
  #       MILLIMETRES
  #
  # Point order MUST remain:
  #
  # P1 = top-left
  # P2 = top-right
  # P3 = bottom-right
  # P4 = bottom-left
  #
  # --------------------------------------------------------

  calibration:

    # Pixel coordinates from development camera image.
    #
    # TEMPORARY VALUES.

    image_points:
      - [150, 150]    # P1
      - [400, 150]    # P2
      - [470, 500]    # P3
      - [60, 500]     # P4

    # Corresponding physical conveyor coordinates.
    #
    # Temporary reference:
    #
    # Conveyor width  = 800 mm
    # Calibration length = 2000 mm

    world_points_mm:
      - [0, 0]        # P1
      - [800, 0]      # P2
      - [800, 2000]   # P3
      - [0, 2000]     # P4

