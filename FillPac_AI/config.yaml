      detection_roi:
        x1: 0
        y1: 120
        x2: 1920
        y2: 1080

      allowed_classes:
        - 0
        - 1

      bag_confidence: 0.35
      print_confidence: 0.20

    counting:
      method: center
      # TEMPORARY DIAGNOSTIC VALUE (was up) -- run with "both"
      # first to confirm the counting mechanism itself works,
      # regardless of which physical direction is correct. Once
      # a bag counts, set this back to "up" or "down" based
      # on the actual observed movement.
      direction: both

      duplicate_distance: 30
      duplicate_time: 0.8

      line_tolerance: 12
      late_start_margin: 40

      # TEMPORARY TEST VALUE (was 15) -- set to 0 to remove this
      # restriction while verifying physical-center counting.
      # Restore to 15 once Count is confirmed working.
      minimum_cross_distance: 0
      min_track_frames: 4

      stale_track_frames: 120

    print_detection:
      enabled: false

      confidence: 0.20
      iou: 0.45

      iou_threshold: 0.0
      min_overlap_ratio: 0.30

      min_print_area: 80
      max_print_area: 0

      min_aspect_ratio: 0
      max_aspect_ratio: 0
      max_center_distance: 0

      vote_threshold: 0.60
      min_votes: 4
      min_observations: 4

      history_size: 30
      history_ttl_frames: 120

      min_observation_speed: 0.0
      skip_motion_jump_observations: true

    jam_detection:
      enabled: true

      roi:
        x1: 0
        y1: 150
        x2: 477
        y2: 500

      history_seconds: 1.0
      min_history_seconds: 0.5

      stationary_speed_threshold: 4.0
      slow_speed_threshold: 9.0

      warning_time_seconds: 3.0
      jam_time_seconds: 5.0
      recovery_time_seconds: 1.0

      min_track_age: 4

      ignore_unstable_tracks: true
      ignore_motion_jumps: true

