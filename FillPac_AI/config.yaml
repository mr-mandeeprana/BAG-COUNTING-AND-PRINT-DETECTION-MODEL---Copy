# ==========================================================
# FillPac AI - Bag Counting & Print Detection Configuration
# ==========================================================

project:
  name: "FillPac AI"
  version: "1.0.0"


# ----------------------------------------------------------
# MODEL
# ----------------------------------------------------------

model: &default_model
  path: "models/fillpac_yolo26n_best.pt"

  confidence: 0.25
  iou: 0.45

  # CPU deployment
  # Change to "cuda" only if NVIDIA CUDA is available
  device: "cpu"

  image_size: 640

  # FP16 should remain false when using CPU
  half: false

  max_detections: 50

  min_bbox_area: 800

  # Detection area
  detection_roi:
    x1: 0
    y1: 120
    x2: 1920
    y2: 1080

  # Class 0 = Bag
  # Class 1 = Print
  allowed_classes:
    - 0
    - 1

  bag_confidence: 0.35

  print_confidence: 0.25


# ----------------------------------------------------------
# TRACKER
# ----------------------------------------------------------

tracker:

  type: "bytetrack"

  track_high_thresh: 0.45

  # These parameters may not be supported directly by
  # the installed supervision.ByteTrack version.
  track_low_thresh: 0.10

  new_track_thresh: 0.60

  track_buffer: 60

  match_thresh: 0.85

  frame_rate: 30

  minimum_consecutive_frames: 1

  min_track_age: 4

  min_bbox_area: 4000

  min_bbox_area_ratio: 0.002

  min_track_confidence: 0.25

  max_jump_distance: 250

  min_iou_warning: 0.10

  unstable_frame_threshold: 3

  history_ttl_frames: 120


# ----------------------------------------------------------
# COUNTING
# ----------------------------------------------------------

counting: &default_counting

  # Count using bag center crossing
  method: "center"

  # Bag movement direction
  direction: "up"

  # Duplicate suppression
  duplicate_distance: 30

  duplicate_time: 0.8

  # Counting line tolerance
  line_tolerance: 12

  # Allow tracks that appear near counting line
  late_start_margin: 40

  # Minimum movement required before count
  minimum_cross_distance: 15

  # Minimum track lifetime
  min_track_frames: 4

  # Remove stale track information
  stale_track_frames: 120


# ----------------------------------------------------------
# PRINT DETECTION
# ----------------------------------------------------------

print_detection: &default_print_detection

  enabled: true

  confidence: 0.25

  # Minimum IoU
  iou_threshold: 0.00

  # Required print/bag overlap ratio
  min_overlap_ratio: 0.30

  # Minimum print bounding box area
  min_print_area: 80

  # 0 = disabled
  max_print_area: 0

  min_aspect_ratio: 0

  max_aspect_ratio: 0

  max_center_distance: 0

  # Print voting configuration
  vote_threshold: 0.60

  min_votes: 4

  history_ttl_frames: 120


# ----------------------------------------------------------
# CAMERAS
# ----------------------------------------------------------

cameras:

  # ========================================================
  # CAMERA 1
  # Bag Counting + Print Detection
  # ========================================================

  - id: 1

    name: "Camera 1"

    enabled: true

    mode: "video"

    source: "data/videos/camera 1.mp4"

    buffer_size: 1

    # Dashboard updates maximum twice per second
    dashboard_publish_interval: 0.5

    model: *default_model

    counting: *default_counting

    print_detection:
      enabled: true
      confidence: 0.25

    # Counting line
    roi:
      x1: 0
      y1: 350
      x2: 477
      y2: 350


  # ========================================================
  # CAMERA 2
  # Bag Counting + Print Detection
  # ========================================================

  - id: 2

    name: "Camera 2"

    enabled: true

    mode: "video"

    source: "data/videos/camera 2.mp4"

    buffer_size: 1

    dashboard_publish_interval: 0.5

    model: *default_model

    counting: *default_counting

    print_detection:
      enabled: true
      confidence: 0.25

    # Counting line
    roi:
      x1: 0
      y1: 350
      x2: 477
      y2: 350


  # ========================================================
  # CAMERA 3
  # Bag Counting Only
  # ========================================================

  - id: 3

    name: "Camera 3"

    enabled: true

    mode: "video"

    source: "data/videos/camera 3.mp4"

    buffer_size: 1

    dashboard_publish_interval: 0.5

    model: *default_model

    counting: *default_counting

    # Camera 3 does NOT perform print detection
    print_detection:
      enabled: false

    # Counting line
    roi:
      x1: 150
      y1: 350
      x2: 1200
      y2: 350


  # ========================================================
  # CAMERA 4
  # Bag Counting Only
  # ========================================================

  - id: 4

    name: "Camera 4"

    enabled: true

    mode: "video"

    source: "data/videos/camera 4.mp4"

    buffer_size: 1

    dashboard_publish_interval: 0.5

    model: *default_model

    counting: *default_counting

    # Camera 4 does NOT perform print detection
    print_detection:
      enabled: false

    # Counting line
    roi:
      x1: 150
      y1: 350
      x2: 1200
      y2: 350


# ----------------------------------------------------------
# DISPLAY
# ----------------------------------------------------------

display:

  # Draw YOLO bounding boxes
  show_boxes: true

  # Show detection labels
  show_labels: true

  # Show bag center point
  show_center: true

  # Show counting line
  show_roi: true

  # Show camera FPS
  show_fps: true

  # Show total count
  show_count: true


# ----------------------------------------------------------
# OUTPUT
# ----------------------------------------------------------

output:

  # Save processed video
  save_video: false

  # Save detection images
  save_images: false

  # Output directory
  output_path: "data/output"


# ----------------------------------------------------------
# ELASTICSEARCH
# ----------------------------------------------------------

elasticsearch:

  # Keep false until Elasticsearch is running
  enabled: false

  host: "localhost"

  port: 9200

  indices:

    count: "fillpac-count"

    print: "fillpac-print"

    camera: "fillpac-camera"


# ----------------------------------------------------------
# DASHBOARD
# ----------------------------------------------------------

dashboard:

  # Enable DashboardState
  enabled: true

  # Dashboard backend host
  host: "0.0.0.0"

  # FastAPI dashboard port
  port: 8000

  # Dashboard persistent state
  state_file: "dashboard/backend/state.json"

  # Write state maximum approximately once per second
  persist_interval_seconds: 1.0


# ----------------------------------------------------------
# LOGGING
# ----------------------------------------------------------

logging:

  level: "INFO"

  # Main application logs
  file: "logs/application.log"

  # Individual bag count events
  count_file: "logs/count_events.jsonl"