# ==========================================================
# DISPLAY
# ==========================================================

display:
  show_boxes: true
  show_labels: true
  show_center: true
  show_roi: true

  show_fps: true
  show_count: true

  show_jam_roi: true
  show_jam_status: true
  show_jam_speed: true
  show_stationary_time: true


# ==========================================================
# OUTPUT
# ==========================================================

output:
  save_video: false
  save_images: false

  output_path: data/output


# ==========================================================
# ELASTICSEARCH
# ==========================================================

elasticsearch:
  enabled: false

  host: localhost
  port: 9200

  indices:
    count: fillpac-count
    print: fillpac-print
    camera: fillpac-camera


# ==========================================================
# DASHBOARD
# ==========================================================

dashboard:
  enabled: true

  host: 0.0.0.0
  port: 8000

  state_file: dashboard/backend/state.json

  publish_interval: 0.25
  stale_timeout: 10.0


# ==========================================================
# LOGGING
# ==========================================================

logging:
  level: INFO

  file: logs/application.log

  count_events_enabled: true
  count_file: logs/count_events.jsonl

  count_flush_immediately: true